<!-- Hano Crypto wordmark for the case-study header. Plain Frost White type on
     the Void ground, matching how the other case studies set their marks —
     the earlier purple badge sat on the page as a filled block. Each glyph of
     HA_O is placed individually so the bar can sit over the N alone (a second
     text run collides with the first). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 62" width="132" height="62" role="img" aria-label="Hano Crypto">
  <g fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="21" text-anchor="middle">
    <text x="14" y="24">H</text>
    <text x="34" y="24">A</text>
    <text x="55" y="24">N</text>
    <text x="76" y="24">O</text>
    <text x="45" y="52" letter-spacing="1.4">CRYPTO</text>
  </g>
  <rect x="45" y="7" width="20" height="2.6" fill="#FFFFFF"/>
</svg>
